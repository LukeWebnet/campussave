		return this.num[index];

			for (var j = 0; j < e.getLength(); j++) {

		}
	
		return new QRPolynomial(num, 0);
	},

		if (this.getLength() - e.getLength() < 0) {
			return this;

	}

  function sweep() {
    let changed=false;
    for(const r of data.reservations){if(r.status!=='reserved')continue;const p=getProduct(r.productId);if(Date.now()>=r.expiresAt || !p || Date.now()>=p.deadline){
      r.status='cancelled';r.cancelledAt=Date.now();const l=data.lockers.find(l=>l.id===r.lockerId);
      if(l&&l.reservationId===r.id){l.reservationId=null;l.status=p && Date.now()<p.deadline?'available':'expired';}
      notify('student','Réservation annulée',`Le panier « ${p?.title||'inconnu'} » (${r.lockerId}) n’a pas été récupéré à temps.`,'warning');
      addLog(`Annulation automatique : réservation ${r.code}, casier ${r.lockerId}`);changed=true;
    }}
    for(const l of data.lockers){if(l.status==='available'){const p=getProduct(l.productId);if(!p || p.deadline<=Date.now()){l.status='expired';addLog(`Produit arrivé à échéance dans le casier ${l.id}`);changed=true;}}}
    if(changed)save();return changed;
  }

    if(m.type==='reservation'){
      const r=data.reservations.find(r=>r.id===m.id);if(!r)return '';
      const p=getProduct(r.productId);const active=r.status==='reserved';const body=`<div class="chip-row" style="justify-content:space-between"><strong>${escapeHtml(p?.title||'Panier')}</strong>${chip(r.status)}</div>${active?`<div class="qr-card">${qrSVG(`CAMPUSSAVE|${r.id}|${r.code}`)}<div class="code">${r.code}</div><small>Code unique de retrait · Casier ${escapeHtml(r.lockerId)}</small></div><p class="note">${svg('info',15)} Le scan est simulé : passez en mode Administrateur et saisissez le code de retrait ou cliquez sur « Simuler le scan ».</p><div class="bottom-actions" style="margin-top:16px"><span class="inline-detail">${svg('clock',15)} Expire dans <strong class="countdown" data-countdown="${r.expiresAt}">${remaining(r.expiresAt)}</strong></span><button class="button secondary small" data-action="copy-code" data-code="${r.code}">${svg('copy',15)} Copier le code</button></div>`:`<div class="qr-card"><div style="font-size:55px">${r.status==='collected'?'✅':'⌛'}</div><strong>${r.status==='collected'?'Panier récupéré !':'Réservation annulée'}</strong><p class="muted mini" style="margin-top:8px">Casier ${escapeHtml(r.lockerId)} · ${dateFmt(r.createdAt)}</p></div>`}`;
      return modalScaffold('Mon panier',`Réservation du ${dateFmt(r.createdAt)}`,body);
    }
    if(m.type==='locker'){
      const l=data.lockers.find(l=>l.id===m.id);if(!l)return '';const p=getProduct(l.productId);const r=data.reservations.find(x=>x.id===l.reservationId);
      return modalScaffold(`Casier ${l.id}`,'État virtuel en temps réel',`<div class="selected-locker"><strong>État :</strong> ${l.status==='empty'?'Libre':l.status==='reserved'?'Réservé':l.status==='available'?'Disponible':'Périmé'}<br/><strong>Panier :</strong> ${p?escapeHtml(p.title):'Aucun'}<br/><strong>Réservation :</strong> ${r?escapeHtml(r.code):'Aucune'}<br/><strong>Capteur :</strong> ${data.temperature.toFixed(1).replace('.',',')} °C (simulé)</div>${l.status==='expired'?`<button class="button danger" style="margin-top:16px" data-action="clear-expired" data-id="${l.id}">${svg('refresh',15)} Retirer le produit périmé</button>`:''}`);
    }
    if(m.type==='architecture'){
      return modalScaffold('Architecture technique','Schéma fictif : aucune connexion réseau n’est réellement utilisée.',`<div class="architecture-diagram"><div class="diagram-box"><strong>Interface CampusSave</strong><span>Étudiant · Commerçant · Administrateur (navigateur)</span></div><div class="diagram-arrow">↓ HTTPS (fictif) ↑</div><div class="diagram-box"><strong>Serveur applicatif + API REST</strong><span>Gestion des paniers, QR codes, notifications, réservations</span></div><div class="diagram-arrow">↕</div><div class="diagram-box"><strong>Base de données</strong><span>Utilisateurs, produits, casiers, commandes, événements</span></div><div class="diagram-arrow">↓ MQTT / HTTPS (fictif) ↑</div><div class="diagram-box"><strong>ESP32 / contrôleur IoT virtuel</strong><span>Commandes d’ouverture, états des casiers, réseau Wi-Fi</span></div><div class="diagram-arrow">↓</div><div class="diagram-bottom"><div class="diagram-box"><strong>🌡️ Capteur</strong><span>Température simulée</span></div><div class="diagram-box"><strong>🔒 Serrures</strong><span>Ouverture simulée</span></div></div></div><div class="note" style="margin-top:18px">${svg('info',15)} <strong>Implémentation réelle de la démo :</strong> JavaScript dans un seul navigateur + données en localStorage. Tous les composants réseau et IoT ci-dessus sont conceptuels.</div>`,true);
    }
    if(m.type==='reset')return modalScaffold('Réinitialiser la démonstration','Cette action effacera les données locales actuelles.',`<div class="note warning">Vous retrouverez les paniers et les casiers fictifs de départ.</div><div class="bottom-actions" style="margin-top:22px"><button class="button secondary" data-action="close-modal">Annuler</button><button class="button danger" data-action="confirm-reset">${svg('refresh',16)} Réinitialiser</button></div>`);
    return '';
  }
  function render(restoreSearch=false){
    const focused=restoreSearch && document.activeElement?.id==='product-search';const selection=focused?document.activeElement.selectionStart:null;
    root.innerHTML=topNav()+({student:studentPage,merchant:merchantPage,admin:adminPage}[ui.role]())+endNav()+notificationsPanel()+modalHTML()+'<div class="toast-area" id="toast-area" aria-live="polite"></div>';
    if(focused){const el=document.getElementById('product-search');if(el){el.focus();try{el.setSelectionRange(selection,selection);}catch(_){}}}
  }
  function toast(message,kind='success'){
    const host=document.getElementById('toast-area');if(!host)return;
    const t=document.createElement('div');t.className='toast'+(kind==='error'?' error':'');t.innerHTML=svg(kind==='error'?'alert':'checkCircle',16)+'<span>'+escapeHtml(message)+'</span>';host.appendChild(t);setTimeout(()=>t.remove(),3800);
  }
  function reserve(productId){
    sweep();const p=getProduct(productId);if(!p||data.critical){toast('Réservation indisponible actuellement.','error');render();return;}
    const l=freeUnits(p)[0];if(!l){toast('Il ne reste aucun panier disponible.','error');render();return;}
    const used=new Set(data.reservations.map(r=>r.code));let code;do{code=String(100000+Math.floor(Math.random()*900000));}while(used.has(code));
    const reservation={id:uid('r'),productId:p.id,lockerId:l.id,code,status:'reserved',createdAt:Date.now(),expiresAt:Math.min(Date.now()+data.ttl*1000,p.deadline)};
    l.status='reserved';l.reservationId=reservation.id;data.reservations.unshift(reservation);
    notify('student','Panier réservé',`Votre panier « ${p.title} » vous attend dans le casier ${l.id}. Code : ${code}.`,'success');
    notify('admin','Nouvelle réservation',`${p.title} · Casier ${l.id} · Code ${code}`,'info');
    addLog(`Réservation validée : casier ${l.id}, code ${code} (simulation)`);save();ui.modal={type:'reservation',id:reservation.id};ui.tab='reservations';render();toast('Votre panier a été réservé !');
  }
  function deposit(id){
    const p=getProduct(id),slots=data.lockers.filter(l=>l.status==='empty');if(!p||p.status!=='pending')return;
    if(p.deadline<=Date.now()){toast('La date limite de l’offre est dépassée.','error');return;}
    if(slots.length<p.quantity){toast('Pas assez de casiers libres pour tous les paniers.','error');return;}
    for(const l of slots.slice(0,p.quantity)){l.productId=p.id;l.reservationId=null;l.status='available';addLog(`Dépôt virtuel : ${p.title}, casier ${l.id}`);}
    p.status='placed';notify('student','Nouveaux paniers disponibles !',`${p.quantity} panier(s) « ${p.title} » sont disponibles.`,'success');
    notify('merchant','Offre acceptée',`Vos paniers « ${p.title} » ont été déposés dans les casiers virtuels.`,'success');
    addLog(`ESP32 virtuel : ${p.quantity} nouveau(x) panier(s) disponible(s)`);save();render();toast('Les paniers sont maintenant visibles par les étudiants.');
  }
  function pickup(id){
    sweep();const r=data.reservations.find(r=>r.id===id);
    if(!r||r.status!=='reserved'){toast('Ce code n’est pas actif ou a expiré.','error');render();return;}
    if(data.critical){toast('Retrait suspendu : alerte de température simulée.','error');return;}
    const l=data.lockers.find(l=>l.id===r.lockerId);if(!l||l.reservationId!==r.id){toast('Le casier associé est indisponible.','error');return;}
    l.status='empty';l.productId=null;l.reservationId=null;r.status='collected';r.collectedAt=Date.now();
    const p=getProduct(r.productId);
    notify('student','Bon appétit ! 💚',`Votre panier « ${p?.title||'CampusSave'} » a été récupéré dans le casier ${l.id}.`,'success');
    notify('merchant','Panier récupéré',`Un panier « ${p?.title||'CampusSave'} » a été distribué.`,'success');
    addLog(`Scan QR simulé : code ${r.code} vérifié`);addLog(`ESP32 virtuel : ouverture du casier ${l.id}`);
    save();if(ui.modal?.type==='reservation'&&ui.modal.id===r.id)ui.modal=null;render();toast(`Retrait simulé réussi : casier ${l.id} libéré.`);
  }
  function reject(id){const p=getProduct(id);if(!p||p.status!=='pending')return;p.status='rejected';notify('merchant','Offre refusée',`L’offre « ${p.title} » n’a pas été acceptée.`,'warning');addLog(`Offre refusée : ${p.title}`);save();render();toast('Proposition refusée.');}
  function clearExpired(id){const l=data.lockers.find(l=>l.id===id);if(!l||l.status!=='expired')return;l.productId=null;l.status='empty';l.reservationId=null;addLog(`Casier ${l.id} vidé après échéance`);save();ui.modal=null;render();toast(`Casier ${l.id} libéré.`);}
  async function convertImage(file){
    if(!file||!file.size)return null;
    if(!file.type.startsWith('image/'))throw new Error('Le fichier doit être une image.');
    if(file.size>8*1024*1024)throw new Error('Photo trop volumineuse (maximum 8 Mo).');
    return await new Promise((resolve,reject)=>{
      const reader=new FileReader();reader.onerror=()=>reject(new Error('Photo illisible.'));
      reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('Format de photo non pris en charge.'));
        im.onload=()=>{const scale=Math.min(1,640/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.68));};im.src=reader.result;};reader.readAsDataURL(file);
    });
  }
  root.addEventListener('click',async event=>{
    const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;
    const action=btn.dataset.action;
    if(action==='overlay'){if(event.target===btn){ui.modal=null;render();}return;}
    if(action==='role'){ui.role=btn.dataset.role;ui.notifications=false;ui.modal=null;ui.tab='catalogue';ui.search='';ui.filter='Tous';render();return;}
    if(action==='tab'){ui.tab=btn.dataset.tab;render();return;}
    if(action==='filter'){ui.filter=btn.dataset.filter;render();return;}
    if(action==='notifications'){ui.notifications=!ui.notifications;render();return;}
    if(action==='mark-read'){visibleNotifications().forEach(n=>{n.read=true;});save();render();return;}
    if(action==='close-modal'){ui.modal=null;render();return;}
    if(['open-product','reservation','locker'].includes(action)){ui.modal={type:({ 'open-product':'product',reservation:'reservation',locker:'locker'})[action],id:btn.dataset.id};ui.notifications=false;render();return;}
    if(action==='architecture'||action==='reset'){ui.modal={type:action};render();return;}
    if(action==='reserve'){reserve(btn.dataset.id);return;}
    if(action==='deposit'){deposit(btn.dataset.id);return;}
    if(action==='reject'){reject(btn.dataset.id);return;}
    if(action==='simulate-scan'){pickup(btn.dataset.id);return;}
    if(action==='clear-expired'){clearExpired(btn.dataset.id);return;}
    if(action==='temperature'){data.critical=!data.critical;data.temperature=data.critical?9.4:3.6;addLog(`Capteur virtuel : température ${data.temperature.toFixed(1)} °C${data.critical?' — ALERTE':''}`);notify('admin',data.critical?'Alerte de température !':'Température rétablie',`Capteur virtuel : ${data.temperature.toFixed(1).replace('.',',')} °C`,data.critical?'error':'success');save();render();toast(data.critical?'Alerte simulée activée.':'Température simulée rétablie.');return;}
    if(action==='ttl'){data.ttl=Number(btn.dataset.seconds);save();render();toast(`Durée des prochaines réservations : ${data.ttl===60?'60 secondes':'30 minutes'}.`);return;}
    if(action==='confirm-reset'){data=seed();save();ui.modal=null;ui.tab='catalogue';ui.role='student';ui.notifications=false;render();toast('Démonstration réinitialisée.');return;}
    if(action==='copy-code'){
      const code=btn.dataset.code;try{await navigator.clipboard.writeText(code);toast('Code copié.');}catch(_){const tmp=document.createElement('textarea');tmp.value=code;document.body.appendChild(tmp);tmp.select();const ok=document.execCommand('copy');tmp.remove();toast(ok?'Code copié.':`Code de retrait : ${code}`,ok?'success':'error');}return;
    }
  });
  root.addEventListener('input',event=>{if(event.target?.id==='product-search'){const cursor=event.target.selectionStart;ui.search=event.target.value;render(true);const input=document.getElementById('product-search');if(input){try{input.setSelectionRange(cursor,cursor)}catch(_){}}}});
  root.addEventListener('submit',async event=>{
    const form=event.target;if(!form.matches('[data-form]'))return;event.preventDefault();
    if(form.dataset.form==='pickup'){
      const code=String(new FormData(form).get('pickupCode')||'').trim();const r=data.reservations.find(r=>r.code===code&&r.status==='reserved');
      if(!r){toast('Code de retrait inconnu ou expiré.','error');return;}pickup(r.id);return;
    }
    if(form.dataset.form==='offer'){
      const fd=new FormData(form),title=String(fd.get('title')||'').trim(),merchant=String(fd.get('merchant')||'').trim(),description=String(fd.get('description')||'').trim(),category=String(fd.get('category')||'Autres'),quantity=Number(fd.get('quantity')),price=Number(fd.get('price')),allergens=String(fd.get('allergens')||'').trim(),deadline=new Date(String(fd.get('deadline'))).getTime();
      if(!title||!merchant||!description||!allergens||!categories[category]||!Number.isInteger(quantity)||quantity<1||quantity>12||!Number.isFinite(price)||price<0||price>100||!Number.isFinite(deadline)||deadline<=Date.now()+60000){toast('Veuillez renseigner des valeurs correctes et une date limite future.','error');return;}
      let image=null;const submit=form.querySelector('button[type="submit"]');submit.disabled=true;
      try{image=await convertImage(fd.get('image'));}catch(e){toast(e.message,'error');submit.disabled=false;return;}
      const p={id:uid('p'),title,merchant,description,category,emoji:catEmoji(category),price,quantity,allergens,deadline,status:'pending',image,createdAt:Date.now()};data.products.unshift(p);
      notify('admin','Nouvelle offre en attente',`${merchant} propose ${quantity} panier(s) « ${title} ».`, 'info');addLog(`Offre reçue : ${quantity} panier(s), commerçant ${merchant}`);save();render();toast('Votre proposition a été transmise à l’administrateur.');return;
    }
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&(ui.modal||ui.notifications)){ui.modal=null;ui.notifications=false;render();}});
  save();sweep();render();
  setInterval(()=>{if(sweep())render();else document.querySelectorAll('[data-countdown]').forEach(el=>{const value=Number(el.dataset.countdown);el.textContent=remaining(value);el.classList.toggle('expiring',value-Date.now()<15000);});},1000);
})();

</script>
