		return this.num[index];

			for (var j = 0; j < e.getLength(); j++) {

		}
	
		return new QRPolynomial(num, 0);
	},

		if (this.getLength() - e.getLength() < 0) {
			return this;

	}

  function addLog(text){data.logs.unshift({id:uid('l'),text,createdAt:Date.now()});data.logs=data.logs.slice(0,60);}
  function notify(role,title,body,type='info') {data.notifications.unshift({id:uid('n'),role,title,body,type,read:false,createdAt:Date.now()});data.notifications=data.notifications.slice(0,75);}
  function remaining(deadline){const sec=Math.max(0,Math.ceil((deadline-Date.now())/1000));return `${number(Math.floor(sec/60))}:${number(sec%60)}`;}
  function sweep() {
    let changed=false;
    for(const r of data.reservations){if(r.status!=='reserved')continue;const p=getProduct(r.productId);if(Date.now()>=r.expiresAt || !p || Date.now()>=p.deadline){
      r.status='cancelled';r.cancelledAt=Date.now();const l=data.lockers.find(l=>l.id===r.lockerId);
      if(l&&l.reservationId===r.id){l.reservationId=null;l.status=p && Date.now()<p.deadline?'available':'expired';}
      notify('student','Réservation annulée',`Le panier « ${p?.title||'inconnu'} » (${r.lockerId}) n’a pas été récupéré à temps.`,'warning');
      addLog(`Annulation automatique : réservation ${r.code}, casier ${r.lockerId}`);changed=true;
    }}
    for(const l of data.lockers){if(l.status==='available'){const p=getProduct(l.productId);if(!p || p.deadline<=Date.now()){l.status='expired';addLog(`Produit arrivé à échéance dans le casier ${l.id}`);changed=true;}}}
    if(changed)save();return changed;
  }
  function visibleNotifications(){return data.notifications.filter(n=>n.role===ui.role);}
  function unreadCount(){return visibleNotifications().filter(n=>!n.read).length;}
  function availableCount(){return data.lockers.filter(l=>l.status==='available' && getProduct(l.productId)?.deadline>Date.now()).length;}
  function countCollected(){return data.reservations.filter(r=>r.status==='collected').length;}
  function classStatus(status){return {pending:'amber',placed:'green',rejected:'red',reserved:'amber',collected:'green',cancelled:'gray'}[status]||'gray';}
  function labelStatus(status){return {pending:'En attente',placed:'Mis en casier',rejected:'Refusé',reserved:'Réservé',collected:'Récupéré',cancelled:'Annulé'}[status]||status;}
  function chip(status){return `<span class="pill ${classStatus(status)}">${escapeHtml(labelStatus(status))}</span>`;}

  function endNav(){return `<p class="footer-note">CampusSave · Prototype universitaire fictif · Toutes les données et interactions IoT sont simulées.</p></main></div></div>`;}
  function stat(title,value,icon,color=''){return `<div class="stat"><div><small>${title}</small><strong>${value}</strong></div><div class="stat-icon ${color}">${svg(icon)}</div></div>`;}
  function imageMarkup(p,large=false){return `<div class="${large?'modal-cover':'product-image'} category-${catCss(p.category)}">${p.image?`<img src="${escapeHtml(p.image)}" alt="Photo de ${escapeHtml(p.title)}">`:`<span aria-hidden="true">${escapeHtml(p.emoji||catEmoji(p.category))}</span>`}${large?'':`<span class="image-badge">${escapeHtml(p.category)}</span>`}</div>`;}
  function productCard(p){const qty=freeUnits(p).length;return `<article class="product-card">${imageMarkup(p)}<div class="product-info"><div class="product-shop">${escapeHtml(p.merchant)}</div><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.description)}</p><div class="product-meta"><div class="product-price">${money(p.price)}${p.price>0?'<small> / panier</small>':''}</div><span class="product-qty">${svg('box',14)} ${qty} disponible${qty>1?'s':''}</span></div><button class="button" data-action="open-product" data-id="${escapeHtml(p.id)}">Voir le panier ${svg('arrow',15)}</button></div></article>`;}
  function studentPage(){
    const current=data.products.filter(p=>freeUnits(p).length>0 && (ui.filter==='Tous'||(ui.filter==='Gratuit'?p.price===0:p.category===ui.filter)) && `${p.title} ${p.merchant} ${p.description}`.toLowerCase().includes(ui.search.toLowerCase()));
    const reservations=[...data.reservations].sort((a,b)=>b.createdAt-a.createdAt);
    const tabs=`<div class="switch-tabs"><button class="${ui.tab==='catalogue'?'active':''}" data-action="tab" data-tab="catalogue">${svg('basket',14)} Découvrir</button><button class="${ui.tab==='reservations'?'active':''}" data-action="tab" data-tab="reservations">${svg('history',14)} Mes réservations ${activeReservations().length?`<span class="badge-count">${activeReservations().length}</span>`:''}</button></div>`;
    return `<div class="page-intro"><div><div class="eyebrow">ESPACE ÉTUDIANT</div><h1 class="heading">Manger mieux, gaspiller moins.</h1><p class="subheading">Des paniers à petit prix, à deux pas de votre campus.</p></div><span class="pill green">${svg('checkCircle',14)} 100 % campus</span></div>
    <section class="hero"><div class="hero-content"><div class="hero-kicker">ENSEMBLE CONTRE LE GASPILLAGE</div><h2>De bons produits,<br/>une seconde chance. 💚</h2><p>Réservez les invendus de vos commerçants partenaires et récupérez-les dans un casier connecté virtuel.</p><span class="pill white">✨ Simulez votre première réservation</span></div><div class="hero-art" aria-hidden="true">🥗</div></section>
    <div class="stats-grid">${stat('Paniers disponibles',availableCount(),'basket')}${stat('Mes réservations actives',activeReservations().length,'clock','orange')}${stat('Paniers récupérés',countCollected(),'heart','blue')}</div>
    ${tabs}
    ${ui.tab==='catalogue'?`<div class="section-head"><div><h2>Paniers disponibles</h2><p>Les offres déjà déposées dans nos casiers virtuels.</p></div><span class="pill green">${availableCount()} panier(s)</span></div>
    ${data.critical?`<div class="note danger-note">${svg('alert',16)} Alerte de température simulée : les réservations sont temporairement suspendues.</div>`:''}
    <div class="search-row"><div class="search-box">${svg('search')}<input id="product-search" type="search" placeholder="Rechercher un panier..." value="${escapeHtml(ui.search)}" aria-label="Rechercher des paniers"></div><div class="pills">${['Tous','Gratuit','Boulangerie','Repas','Fruits & légumes'].map(x=>`<button class="pill click ${ui.filter===x?'active':''}" data-action="filter" data-filter="${escapeHtml(x)}">${x}</button>`).join('')}</div></div>
    ${current.length?`<div class="product-grid">${current.map(productCard).join('')}</div>`:empty('🧺','Aucun panier pour le moment','Essayez une autre catégorie ou attendez de nouvelles offres.')}`:
    `<div class="section-head"><div><h2>Mes réservations</h2><p>Vos codes de retrait et l’historique des paniers.</p></div><span class="pill gray">${reservations.length} réservation(s)</span></div>${reservations.length?`<div class="rows">${reservations.map(r=>{const p=getProduct(r.productId);return `<div class="row-item"><div class="row-info"><span class="symbol">${escapeHtml(p?.emoji||'🧺')}</span><div><strong>${escapeHtml(p?.title||'Panier supprimé')}</strong><small>Casier ${escapeHtml(r.lockerId)} · ${dateFmt(r.createdAt)} ${r.status==='reserved'?`· <span class="countdown" data-countdown="${r.expiresAt}">${remaining(r.expiresAt)}</span> restantes`:''}</small></div></div><div class="row-right">${chip(r.status)}<button class="button small secondary" data-action="reservation" data-id="${escapeHtml(r.id)}">${r.status==='reserved'?'Afficher le QR code':'Détails'}</button></div></div>`}).join('')}</div>`:empty('📋','Aucune réservation','Choisissez votre premier panier dans le catalogue.')}`}
    `;
  }
  function empty(emoji,title,description){return `<div class="empty-view"><span class="emoji" aria-hidden="true">${emoji}</span><strong>${title}</strong><p>${description}</p></div>`;}
  function merchantPage(){
    const list=[...data.products].sort((a,b)=>b.createdAt-a.createdAt);
    const inputs=`<form id="new-offer-form" data-form="offer"><div class="form-grid"><div class="field"><label class="input-label" for="merchant-name">Nom du commerçant</label><input id="merchant-name" name="merchant" value="Boulangerie du Campus" maxlength="70" required/></div><div class="field"><label class="input-label" for="offer-category">Catégorie</label><select id="offer-category" name="category">${Object.keys(categories).map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select></div></div><div class="field"><label class="input-label" for="offer-title">Nom du panier</label><input id="offer-title" name="title" placeholder="Ex. Panier de viennoiseries" maxlength="65" required/></div><div class="field"><label class="input-label" for="offer-description">Description du produit</label><textarea id="offer-description" name="description" maxlength="250" placeholder="Contenu, conditionnement, indications utiles..." required></textarea></div><div class="form-grid"><div class="field"><label class="input-label" for="offer-quantity">Nombre de paniers</label><input id="offer-quantity" name="quantity" type="number" min="1" max="12" value="2" required/></div><div class="field"><label class="input-label" for="offer-price">Prix par panier (€)</label><input id="offer-price" name="price" type="number" min="0" max="100" step="0.5" value="0" required/></div><div class="field"><label class="input-label" for="offer-deadline">Date et heure limites</label><input id="offer-deadline" name="deadline" type="datetime-local" value="${asDateTimeLocal(Date.now()+6*3600000)}" required/></div><div class="field"><label class="input-label" for="offer-allergens">Allergènes</label><input id="offer-allergens" name="allergens" maxlength="120" placeholder="Ex. Gluten, lait" value="Aucun déclaré" required/></div></div><div class="field"><label class="input-label" for="offer-image">Photo du panier (facultative)</label><input id="offer-image" name="image" type="file" accept="image/*"/><p class="field-note">La photo sera compressée et conservée uniquement dans ce navigateur.</p></div><div class="note" style="margin-bottom:18px">${svg('info',15)} L’offre restera « En attente » jusqu’à ce qu’un administrateur la place dans les casiers virtuels.</div><button type="submit" class="button full">${svg('plus',16)} Proposer les paniers</button></form>`;
    return `<div class="page-intro"><div><div class="eyebrow">ESPACE COMMERÇANT</div><h1 class="heading">Valorisez vos invendus.</h1><p class="subheading">Publiez vos paniers et laissez l’équipe CampusSave organiser leur dépôt.</p></div><span class="pill green">${svg('store',14)} Commerçant partenaire</span></div>
    <div class="stats-grid">${stat('Offres proposées',data.products.length,'box')}${stat('En attente de dépôt',data.products.filter(p=>p.status==='pending').length,'clock','orange')}${stat('Paniers distribués',countCollected(),'checkCircle','blue')}</div>
    <div class="split-grid"><section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Proposer de nouveaux paniers</h2><p>Créez une offre en quelques étapes.</p></div>${svg('plus',20)}</div>${inputs}</section>
    <section><div class="section-head" style="margin-top:0"><div><h2>Mes offres</h2><p>Statut de chaque proposition.</p></div></div><div class="rows">${list.map(p=>`<div class="row-item"><div class="row-info"><span class="symbol">${escapeHtml(p.emoji||catEmoji(p.category))}</span><div><strong>${escapeHtml(p.title)}</strong><small>${escapeHtml(p.merchant)} · ${p.quantity} panier(s) · ${money(p.price)}</small><small>${p.status==='placed'?`${freeUnits(p).length} disponible(s) dans les casiers`:`À déposer avant le ${dateFmt(p.deadline)}`}</small></div></div><div class="row-right">${chip(p.status)}</div></div>`).join('')}</div><div class="note" style="margin-top:18px">${svg('info',15)} Les produits proposés ne sont visibles par les étudiants qu’après validation par un administrateur.</div></section></div>`;
  }
  function asDateTimeLocal(ms){const d=new Date(ms);return `${d.getFullYear()}-${number(d.getMonth()+1)}-${number(d.getDate())}T${number(d.getHours())}:${number(d.getMinutes())}`;}
  function lockerHTML(l){const p=l.productId?getProduct(l.productId):null;const label={empty:'Libre',available:'Disponible',reserved:'Réservé',expired:'Périmé'}[l.status]||l.status;return `<button data-action="locker" data-id="${l.id}" class="locker ${l.status}" title="Casier ${l.id} : ${label}"><span class="locker-name">${l.id}</span><span class="locker-emoji">${p?escapeHtml(p.emoji||catEmoji(p.category)):svg('plus',21)}</span><span class="locker-detail">${label}</span></button>`;}
  function adminPage(){const pending=data.products.filter(p=>p.status==='pending').sort((a,b)=>a.createdAt-b.createdAt),reserved=activeReservations();const free=data.lockers.filter(l=>l.status==='empty').length;
    return `<div class="page-intro"><div><div class="eyebrow">ESPACE ADMINISTRATEUR</div><h1 class="heading">Tableau de bord des casiers.</h1><p class="subheading">Supervisez les paniers, les retraits et l’IoT virtuel en un seul endroit.</p></div><button class="button secondary" data-action="architecture">${svg('wifi',16)} Architecture réseau</button></div>
    <div class="stats-grid">${stat('Casiers libres',free,'box')}${stat('Offres à traiter',pending.length,'clock','orange')}${stat('Réservations actives',reserved.length,'basket','blue')}</div>
    <div class="admin-grid"><div class="rows"><section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Casier connecté virtuel</h2><p>Une unité de panier par compartiment.</p></div><span class="pill green">${svg('wifi',14)} ESP32 simulé</span></div><div class="locker-grid">${data.lockers.map(lockerHTML).join('')}</div><div class="chip-row"><span class="status-line"><span></span>Disponible</span><span class="status-line"><span class="orange"></span>Réservé</span><span class="status-line"><span class="gray"></span>Libre</span><span class="status-line"><span class="red"></span>Périmé</span></div></section>
    <section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Offres en attente</h2><p>Déposer les paniers dans les casiers disponibles.</p></div></div>${pending.length?`<div class="rows">${pending.map(p=>`<div class="row-item"><div class="row-info"><span class="symbol">${escapeHtml(p.emoji||catEmoji(p.category))}</span><div><strong>${escapeHtml(p.title)}</strong><small>${p.quantity} paniers · ${escapeHtml(p.merchant)}</small><small>À consommer avant le ${dateFmt(p.deadline)}</small></div></div><div class="row-right"><button class="button small" data-action="deposit" data-id="${escapeHtml(p.id)}" ${p.quantity>free||p.deadline<=Date.now()?'disabled title="Pas assez de casiers disponibles ou date limite passée"':''}>${svg('check',15)} Déposer</button><button class="button small ghost" data-action="reject" data-id="${escapeHtml(p.id)}">Refuser</button></div></div>`).join('')}</div>`:empty('✅','Aucune offre en attente','Toutes les propositions ont été traitées.')}${pending.length&&pending.some(p=>p.quantity>free)?'<p class="empty-notice">Libérez des casiers pour accepter les offres volumineuses.</p>':''}</section>
    <section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Retraits à valider</h2><p>Saisissez le code à 6 chiffres du panier.</p></div></div><form data-form="pickup"><div class="field" style="margin-bottom:10px"><input name="pickupCode" class="code-input" placeholder="Code de retrait" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" aria-label="Code de retrait" required/></div><button class="button full" type="submit">${svg('scan',16)} Valider le retrait (simulation)</button></form><div class="divider"></div>${reserved.length?`<div class="rows">${reserved.map(r=>{const p=getProduct(r.productId);return `<div class="row-item"><div class="row-info"><span class="symbol">${escapeHtml(p?.emoji||'🧺')}</span><div><strong>${escapeHtml(p?.title||'Panier')}</strong><small>Casier ${r.lockerId} · Code ${r.code}</small><small>Expire dans <span class="countdown" data-countdown="${r.expiresAt}">${remaining(r.expiresAt)}</span></small></div></div><button class="button small secondary" data-action="simulate-scan" data-id="${r.id}">Simuler le scan</button></div>`}).join('')}</div>`:'<p class="empty-notice">Aucun panier en attente de retrait.</p>'}</section></div>
    <div class="rows"><section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Capteur de température</h2><p>Température et alertes simulées.</p></div>${svg('thermometer',20)}</div><div class="temperature ${data.critical?'critical':''}"><div class="temp-icon">${svg('thermometer',24)}</div><div><strong>${data.temperature.toFixed(1).replace('.',',')} °C</strong><p>${data.critical?'Alerte : seuil dépassé !':'Fonctionnement normal (simulation)'}</p></div></div><div class="chip-row"><button class="button small ${data.critical?'secondary':'danger'}" data-action="temperature">${svg(data.critical?'checkCircle':'alert',14)} ${data.critical?'Rétablir 3,6 °C':'Simuler une alerte'}</button></div>${data.critical?`<div class="note danger-note" style="margin-top:12px">Réservation suspendue jusqu’au rétablissement de la température.</div>`:''}</section>
    <section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Journal d’événements IoT</h2><p>Messages réseau fictifs, aucun équipement connecté.</p></div><span class="pill gray">${svg('wifi',14)} MQTT simulé</span></div><div class="log-list">${data.logs.slice(0,16).map(l=>`<div class="log-entry"><time>${shortTime(l.createdAt)}</time>${escapeHtml(l.text)}</div>`).join('')}</div></section>
    <section class="card-box"><div class="section-head" style="margin-top:0"><div><h2>Paramètres de la démo</h2><p>Personnalisez la durée d’une réservation.</p></div>${svg('settings',20)}</div><div class="chip-row"><button class="pill click ${data.ttl===60?'active':''}" data-action="ttl" data-seconds="60">Mode rapide · 60 secondes</button><button class="pill click ${data.ttl===1800?'active':''}" data-action="ttl" data-seconds="1800">Mode normal · 30 minutes</button></div><p class="field-note" style="margin-top:14px">Le changement affecte uniquement les prochaines réservations.</p><div class="divider"></div><button class="button danger" data-action="reset">${svg('refresh',15)} Réinitialiser la démo</button><p class="field-note">Efface les paniers créés, les réservations et les événements de ce navigateur.</p></section></div></div>`;
  }
  function notificationsPanel(){if(!ui.notifications)return '';const items=visibleNotifications();return `<div class="notif-panel"><div class="notif-head"><strong>Notifications ${unreadCount()?`<span class="badge-count">${unreadCount()}</span>`:''}</strong><button class="muted-link" data-action="mark-read">Tout marquer comme lu</button></div><div class="notif-list">${items.length?items.slice(0,25).map(n=>`<div class="notif-row ${n.read?'':'unread'}"><div class="notif-icon">${svg(notificationIcon(n.type),17)}</div><div><strong>${escapeHtml(n.title)}</strong><p>${escapeHtml(n.body)}</p><time>${dateFmt(n.createdAt)}</time></div></div>`).join(''):'<div class="notif-empty">Aucune notification pour ce rôle.</div>'}</div></div>`;}
  function modalScaffold(title,subtitle,body,wide=false){return `<div class="overlay" data-action="overlay"><div class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-top"><div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(subtitle||'')}</p></div><button class="modal-close" data-action="close-modal" aria-label="Fermer">${svg('close',17)}</button></div>${body}</div></div>`;}
  function qrSVG(payload){
    try{const qr=new window.CampusQRCode(0,1);qr.addData(payload);qr.make();const n=qr.getModuleCount();let rectangles='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))rectangles+=`<rect x="${c+4}" y="${r+4}" width="1" height="1"/>`;return `<svg viewBox="0 0 ${n+8} ${n+8}" width="190" height="190" role="img" aria-label="QR code du panier" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><g fill="#164b3b">${rectangles}</g></svg>`;
    }catch(e){console.error('Échec de création du QR',e);return '<p>Code de retrait disponible ci-dessous.</p>';}
  }
  function modalHTML(){if(!ui.modal)return '';
    const m=ui.modal;
    if(m.type==='product'){
      const p=getProduct(m.id);if(!p)return '';const qty=freeUnits(p).length;
      return modalScaffold(p.title,p.merchant,`${imageMarkup(p,true)}<p class="muted" style="font-size:13px;line-height:1.7">${escapeHtml(p.description)}</p><div class="product-specs"><span>${svg('calendar',16)} À récupérer avant le <strong>${dateFmt(p.deadline)}</strong></span><span>${svg('box',16)} <strong>${qty} panier(s)</strong> encore disponible(s)</span><span>${svg('info',16)} Allergènes : <strong>${escapeHtml(p.allergens)}</strong></span></div><div class="bottom-actions"><span class="modal-price">${money(p.price)}</span><button class="button wide" data-action="reserve" data-id="${escapeHtml(p.id)}" ${!qty||data.critical?'disabled':''}>${svg('basket',16)} Réserver ce panier</button></div>${data.critical?'<p class="note danger-note" style="margin-top:13px">Réservations suspendues : alerte de température.</p>':''}`);
    }
    if(m.type==='reservation'){
      const r=data.reservations.find(r=>r.id===m.id);if(!r)return '';
      const p=getProduct(r.productId);const active=r.status==='reserved';const body=`<div class="chip-row" style="justify-content:space-between"><strong>${escapeHtml(p?.title||'Panier')}</strong>${chip(r.status)}</div>${active?`<div class="qr-card">${qrSVG(`CAMPUSSAVE|${r.id}|${r.code}`)}<div class="code">${r.code}</div><small>Code unique de retrait · Casier ${escapeHtml(r.lockerId)}</small></div><p class="note">${svg('info',15)} Le scan est simulé : passez en mode Administrateur et saisissez le code de retrait ou cliquez sur « Simuler le scan ».</p><div class="bottom-actions" style="margin-top:16px"><span class="inline-detail">${svg('clock',15)} Expire dans <strong class="countdown" data-countdown="${r.expiresAt}">${remaining(r.expiresAt)}</strong></span><button class="button secondary small" data-action="copy-code" data-code="${r.code}">${svg('copy',15)} Copier le code</button></div>`:`<div class="qr-card"><div style="font-size:55px">${r.status==='collected'?'✅':'⌛'}</div><strong>${r.status==='collected'?'Panier récupéré !':'Réservation annulée'}</strong><p class="muted mini" style="margin-top:8px">Casier ${escapeHtml(r.lockerId)} · ${dateFmt(r.createdAt)}</p></div>`}`;
      return modalScaffold('Mon panier',`Réservation du ${dateFmt(r.createdAt)}`,body);
    }
    if(m.type==='locker'){
      const l=data.lockers.find(l=>l.id===m.id);if(!l)return '';const p=getProduct(l.productId);const r=data.reservations.find(x=>x.id===l.reservationId);
      return modalScaffold(`Casier ${l.id}`,'État virtuel en temps réel',`<div class="selected-locker"><strong>État :</strong> ${l.status==='empty'?'Libre':l.status==='reserved'?'Réservé':l.status==='available'?'Disponible':'Périmé'}<br/><strong>Panier :</strong> ${p?escapeHtml(p.title):'Aucun'}<br/><strong>Réservation :</strong> ${r?escapeHtml(r.code):'Aucune'}<br/><strong>Capteur :</strong> ${data.temperature.toFixed(1).replace('.',',')} °C (simulé)</div>${l.status==='expired'?`<button class="button danger" style="margin-top:16px" data-action="clear-expired" data-id="${l.id}">${svg('refresh',15)} Retirer le produit périmé</button>`:''}`);
    }
    if(m.type==='architecture'){
      return modalScaffold('Architecture technique','Schéma fictif : aucune connexion réseau n’est réellement utilisée.',`<div class="architecture-diagram"><div class="diagram-box"><strong>Interface CampusSave</strong><span>Étudiant · Commerçant · Administrateur (navigateur)</span></div><div class="diagram-arrow">↓ HTTPS (fictif) ↑</div><div class="diagram-box"><strong>Serveur applicatif + API REST</strong><span>Gestion des paniers, QR codes, notifications, réservations</span></div><div class="diagram-arrow">↕</div><div class="diagram-box"><strong>Base de données</strong><span>Utilisateurs, produits, casiers, commandes, événements</span></div><div class="diagram-arrow">↓ MQTT / HTTPS (fictif) ↑</div><div class="diagram-box"><strong>ESP32 / contrôleur IoT virtuel</strong><span>Commandes d’ouverture, états des casiers, réseau Wi-Fi</span></div><div class="diagram-arrow">↓</div><div class="diagram-bottom"><div class="diagram-box"><strong>🌡️ Capteur</strong><span>Température simulée</span></div><div class="diagram-box"><strong>🔒 Serrures</strong><span>Ouverture simulée</span></div></div></div><div class="note" style="margin-top:18px">${svg('info',15)} <strong>Implémentation réelle de la démo :</strong> JavaScript dans un seul navigateur + données en localStorage. Tous les composants réseau et IoT ci-dessus sont conceptuels.</div>`,true);
    }
    if(m.type==='reset')return modalScaffold('Réinitialiser la démonstration','Cette action effacera les données locales actuelles.',`<div class="note warning">Vous retrouverez les paniers et les casiers fictifs de départ.</div><div class="bottom-actions" style="margin-top:22px"><button class="button secondary" data-action="close-modal">Annuler</button><button class="button danger" data-action="confirm-reset">${svg('refresh',16)} Réinitialiser</button></div>`);
    return '';
  }
  function render(restoreSearch=false){
    const focused=restoreSearch && document.activeElement?.id==='product-search';const selection=focused?document.activeElement.selectionStart:null;
    root.innerHTML=topNav()+({student:studentPage,merchant:merchantPage,admin:adminPage}[ui.role]())+endNav()+notificationsPanel()+modalHTML()+'<div class="toast-area" id="toast-area" aria-live="polite"></div>';
    if(focused){const el=document.getElementById('product-search');if(el){el.focus();try{el.setSelectionRange(selection,selection);}catch(_){}}}
  }
  function toast(message,kind='success'){
    const host=document.getElementById('toast-area');if(!host)return;
    const t=document.createElement('div');t.className='toast'+(kind==='error'?' error':'');t.innerHTML=svg(kind==='error'?'alert':'checkCircle',16)+'<span>'+escapeHtml(message)+'</span>';host.appendChild(t);setTimeout(()=>t.remove(),3800);
  }
  function reserve(productId){
    sweep();const p=getProduct(productId);if(!p||data.critical){toast('Réservation indisponible actuellement.','error');render();return;}
    const l=freeUnits(p)[0];if(!l){toast('Il ne reste aucun panier disponible.','error');render();return;}
    const used=new Set(data.reservations.map(r=>r.code));let code;do{code=String(100000+Math.floor(Math.random()*900000));}while(used.has(code));
    const reservation={id:uid('r'),productId:p.id,lockerId:l.id,code,status:'reserved',createdAt:Date.now(),expiresAt:Math.min(Date.now()+data.ttl*1000,p.deadline)};
    l.status='reserved';l.reservationId=reservation.id;data.reservations.unshift(reservation);
    notify('student','Panier réservé',`Votre panier « ${p.title} » vous attend dans le casier ${l.id}. Code : ${code}.`,'success');
    notify('admin','Nouvelle réservation',`${p.title} · Casier ${l.id} · Code ${code}`,'info');
    addLog(`Réservation validée : casier ${l.id}, code ${code} (simulation)`);save();ui.modal={type:'reservation',id:reservation.id};ui.tab='reservations';render();toast('Votre panier a été réservé !');
  }
  function deposit(id){
    const p=getProduct(id),slots=data.lockers.filter(l=>l.status==='empty');if(!p||p.status!=='pending')return;
    if(p.deadline<=Date.now()){toast('La date limite de l’offre est dépassée.','error');return;}
    if(slots.length<p.quantity){toast('Pas assez de casiers libres pour tous les paniers.','error');return;}
    for(const l of slots.slice(0,p.quantity)){l.productId=p.id;l.reservationId=null;l.status='available';addLog(`Dépôt virtuel : ${p.title}, casier ${l.id}`);}
    p.status='placed';notify('student','Nouveaux paniers disponibles !',`${p.quantity} panier(s) « ${p.title} » sont disponibles.`,'success');
    notify('merchant','Offre acceptée',`Vos paniers « ${p.title} » ont été déposés dans les casiers virtuels.`,'success');
    addLog(`ESP32 virtuel : ${p.quantity} nouveau(x) panier(s) disponible(s)`);save();render();toast('Les paniers sont maintenant visibles par les étudiants.');
  }
  function pickup(id){
    sweep();const r=data.reservations.find(r=>r.id===id);
    if(!r||r.status!=='reserved'){toast('Ce code n’est pas actif ou a expiré.','error');render();return;}
    if(data.critical){toast('Retrait suspendu : alerte de température simulée.','error');return;}
    const l=data.lockers.find(l=>l.id===r.lockerId);if(!l||l.reservationId!==r.id){toast('Le casier associé est indisponible.','error');return;}
    l.status='empty';l.productId=null;l.reservationId=null;r.status='collected';r.collectedAt=Date.now();
    const p=getProduct(r.productId);
    notify('student','Bon appétit ! 💚',`Votre panier « ${p?.title||'CampusSave'} » a été récupéré dans le casier ${l.id}.`,'success');
    notify('merchant','Panier récupéré',`Un panier « ${p?.title||'CampusSave'} » a été distribué.`,'success');
    addLog(`Scan QR simulé : code ${r.code} vérifié`);addLog(`ESP32 virtuel : ouverture du casier ${l.id}`);
    save();if(ui.modal?.type==='reservation'&&ui.modal.id===r.id)ui.modal=null;render();toast(`Retrait simulé réussi : casier ${l.id} libéré.`);
  }
  function reject(id){const p=getProduct(id);if(!p||p.status!=='pending')return;p.status='rejected';notify('merchant','Offre refusée',`L’offre « ${p.title} » n’a pas été acceptée.`,'warning');addLog(`Offre refusée : ${p.title}`);save();render();toast('Proposition refusée.');}
  function clearExpired(id){const l=data.lockers.find(l=>l.id===id);if(!l||l.status!=='expired')return;l.productId=null;l.status='empty';l.reservationId=null;addLog(`Casier ${l.id} vidé après échéance`);save();ui.modal=null;render();toast(`Casier ${l.id} libéré.`);}
  async function convertImage(file){
    if(!file||!file.size)return null;
    if(!file.type.startsWith('image/'))throw new Error('Le fichier doit être une image.');
    if(file.size>8*1024*1024)throw new Error('Photo trop volumineuse (maximum 8 Mo).');
    return await new Promise((resolve,reject)=>{
      const reader=new FileReader();reader.onerror=()=>reject(new Error('Photo illisible.'));
      reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('Format de photo non pris en charge.'));
        im.onload=()=>{const scale=Math.min(1,640/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.68));};im.src=reader.result;};reader.readAsDataURL(file);
    });
  }
  root.addEventListener('click',async event=>{
    const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;
    const action=btn.dataset.action;
    if(action==='overlay'){if(event.target===btn){ui.modal=null;render();}return;}
    if(action==='role'){ui.role=btn.dataset.role;ui.notifications=false;ui.modal=null;ui.tab='catalogue';ui.search='';ui.filter='Tous';render();return;}
    if(action==='tab'){ui.tab=btn.dataset.tab;render();return;}
    if(action==='filter'){ui.filter=btn.dataset.filter;render();return;}
    if(action==='notifications'){ui.notifications=!ui.notifications;render();return;}
    if(action==='mark-read'){visibleNotifications().forEach(n=>{n.read=true;});save();render();return;}
    if(action==='close-modal'){ui.modal=null;render();return;}
    if(['open-product','reservation','locker'].includes(action)){ui.modal={type:({ 'open-product':'product',reservation:'reservation',locker:'locker'})[action],id:btn.dataset.id};ui.notifications=false;render();return;}
    if(action==='architecture'||action==='reset'){ui.modal={type:action};render();return;}
    if(action==='reserve'){reserve(btn.dataset.id);return;}
    if(action==='deposit'){deposit(btn.dataset.id);return;}
    if(action==='reject'){reject(btn.dataset.id);return;}
    if(action==='simulate-scan'){pickup(btn.dataset.id);return;}
    if(action==='clear-expired'){clearExpired(btn.dataset.id);return;}
    if(action==='temperature'){data.critical=!data.critical;data.temperature=data.critical?9.4:3.6;addLog(`Capteur virtuel : température ${data.temperature.toFixed(1)} °C${data.critical?' — ALERTE':''}`);notify('admin',data.critical?'Alerte de température !':'Température rétablie',`Capteur virtuel : ${data.temperature.toFixed(1).replace('.',',')} °C`,data.critical?'error':'success');save();render();toast(data.critical?'Alerte simulée activée.':'Température simulée rétablie.');return;}
    if(action==='ttl'){data.ttl=Number(btn.dataset.seconds);save();render();toast(`Durée des prochaines réservations : ${data.ttl===60?'60 secondes':'30 minutes'}.`);return;}
    if(action==='confirm-reset'){data=seed();save();ui.modal=null;ui.tab='catalogue';ui.role='student';ui.notifications=false;render();toast('Démonstration réinitialisée.');return;}
    if(action==='copy-code'){
      const code=btn.dataset.code;try{await navigator.clipboard.writeText(code);toast('Code copié.');}catch(_){const tmp=document.createElement('textarea');tmp.value=code;document.body.appendChild(tmp);tmp.select();const ok=document.execCommand('copy');tmp.remove();toast(ok?'Code copié.':`Code de retrait : ${code}`,ok?'success':'error');}return;
    }
  });
  root.addEventListener('input',event=>{if(event.target?.id==='product-search'){const cursor=event.target.selectionStart;ui.search=event.target.value;render(true);const input=document.getElementById('product-search');if(input){try{input.setSelectionRange(cursor,cursor)}catch(_){}}}});
  root.addEventListener('submit',async event=>{
    const form=event.target;if(!form.matches('[data-form]'))return;event.preventDefault();
    if(form.dataset.form==='pickup'){
      const code=String(new FormData(form).get('pickupCode')||'').trim();const r=data.reservations.find(r=>r.code===code&&r.status==='reserved');
      if(!r){toast('Code de retrait inconnu ou expiré.','error');return;}pickup(r.id);return;
    }
    if(form.dataset.form==='offer'){
      const fd=new FormData(form),title=String(fd.get('title')||'').trim(),merchant=String(fd.get('merchant')||'').trim(),description=String(fd.get('description')||'').trim(),category=String(fd.get('category')||'Autres'),quantity=Number(fd.get('quantity')),price=Number(fd.get('price')),allergens=String(fd.get('allergens')||'').trim(),deadline=new Date(String(fd.get('deadline'))).getTime();
      if(!title||!merchant||!description||!allergens||!categories[category]||!Number.isInteger(quantity)||quantity<1||quantity>12||!Number.isFinite(price)||price<0||price>100||!Number.isFinite(deadline)||deadline<=Date.now()+60000){toast('Veuillez renseigner des valeurs correctes et une date limite future.','error');return;}
      let image=null;const submit=form.querySelector('button[type="submit"]');submit.disabled=true;
      try{image=await convertImage(fd.get('image'));}catch(e){toast(e.message,'error');submit.disabled=false;return;}
      const p={id:uid('p'),title,merchant,description,category,emoji:catEmoji(category),price,quantity,allergens,deadline,status:'pending',image,createdAt:Date.now()};data.products.unshift(p);
      notify('admin','Nouvelle offre en attente',`${merchant} propose ${quantity} panier(s) « ${title} ».`, 'info');addLog(`Offre reçue : ${quantity} panier(s), commerçant ${merchant}`);save();render();toast('Votre proposition a été transmise à l’administrateur.');return;
    }
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&(ui.modal||ui.notifications)){ui.modal=null;ui.notifications=false;render();}});
  save();sweep();render();
  setInterval(()=>{if(sweep())render();else document.querySelectorAll('[data-countdown]').forEach(el=>{const value=Number(el.dataset.countdown);el.textContent=remaining(value);el.classList.toggle('expiring',value-Date.now()<15000);});},1000);
})();

</script>
</body>
</html>
